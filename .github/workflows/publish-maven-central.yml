# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".
# Purpose: Publish the library to Maven Central on demand: sign, upload, then tag and create the GitHub Release.

name: publish-maven-central
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release this version instead of computing it from the commits
        required: false
        type: string
      dry_run:
        description: "Build and sign only: upload nothing, tag nothing"
        required: false
        type: boolean
        default: false
      auto_publish:
        description: Release the validated bundle automatically; off leaves it in the Central Portal to publish or drop
        required: false
        type: boolean
        default: true
jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: maven-central
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        id: install_dependencies
        run: |-
          if [ ! -f package-lock.json ]; then
            echo "::error file=package.json::package-lock.json is not committed. Run npm install, commit package-lock.json, and push."
            exit 1
          fi
          npm ci --ignore-scripts
      - name: Setup Java
        id: setup_java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Compute release version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: npx projen release:version
      - name: Refuse a SNAPSHOT version
        id: refuse_a_snapshot_version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |-
          case "$VERSION" in
            *-SNAPSHOT) echo "::error::$VERSION is a snapshot; Maven Central does not take snapshots."; exit 1 ;;
          esac
      - name: Build and sign (dry run)
        id: build_and_sign_dry_run
        if: steps.version.outputs.release == 'true' && inputs.dry_run
        env:
          MAVEN_ARGS: -Drevision=${{ steps.version.outputs.version }} -Dchangelist=
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: npx projen publish:maven-central:dry-run
      - name: Publish to Maven Central
        id: publish
        if: steps.version.outputs.release == 'true' && !inputs.dry_run
        env:
          MAVEN_ARGS: -Drevision=${{ steps.version.outputs.version }} -Dchangelist= -DautoPublish=${{ inputs.auto_publish }} -DwaitUntil=${{ inputs.auto_publish && 'published' || 'validated' }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: npx projen publish:maven-central
      - name: Tag and create the GitHub Release
        id: tag_and_create_the_github_release
        if: steps.version.outputs.release == 'true' && !inputs.dry_run && inputs.auto_publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
      - name: Print the tag command
        id: print_the_tag_command
        if: steps.version.outputs.release == 'true' && !inputs.dry_run && !inputs.auto_publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |-
          echo "The bundle is validated, not released. Publish or drop it in the Central Portal."
          echo "After publishing, tag it:"
          echo "  git tag -a v$VERSION -m v$VERSION $GITHUB_SHA && git push origin v$VERSION"
